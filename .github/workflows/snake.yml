# Generates an ocean-themed "eel" that eats the contribution graph, refreshed daily.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate daily at midnight UTC
  workflow_dispatch:        # allow manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (ocean palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HrishiKabra
          # Light mode: teal water dots, coral-orange eel
          # Dark mode: deep-sea blues
          outputs: |
            dist/snake.svg?color_snake=#ff6d00&color_dots=#e0f7fa,#80deea,#26c6da,#0097a7,#006064
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff8a50&color_dots=#0d2137,#14455c,#1b6e85,#22a3b8,#5ee7df

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: true   # don't wipe the dive cards / 3d terrain / metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
