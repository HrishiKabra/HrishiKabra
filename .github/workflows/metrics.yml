# Renders the isocalendar + languages metrics panel.
# NOTE: lowlighter/metrics cannot use the built-in GITHUB_TOKEN — create a
# classic PAT (scopes: public_repo, read:user) and save it as the METRICS_TOKEN
# repo secret. See docs/DEPLOY.md.

name: Generate metrics panel

on:
  schedule:
    - cron: "45 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HrishiKabra
          base: ""
          filename: metrics.svg
          output_action: commit
          committer_branch: output
          committer_message: "chore: update metrics panel"
          config_timezone: America/Chicago
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
